services:
  - type: web
    name: brix1-backend
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://brix1-frontend.onrender.com

  - type: web
    name: brix1-frontend
    runtime: static
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build:frontend
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://brix1-backend.onrender.com
      - key: VITE_BACKEND_URL
        value: https://brix1-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://brix1-backend.onrender.com/ws
