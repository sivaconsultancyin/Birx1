name: Update PostgreSQL lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL driver and generate lockfile
        run: npm install pg@^8.16.3 --save && npm install -D @types/pg@^8.15.5

      - name: Verify dependency tree
        run: |
          npm ls pg @types/pg
          node -e "const p=require('./package.json'); if(!p.dependencies.pg || !p.devDependencies['@types/pg']) process.exit(1)"

      - name: Commit generated package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package changes to commit."
            exit 0
          fi
          git commit -m "chore: generate lockfile for PostgreSQL driver"
          git push origin HEAD:main
