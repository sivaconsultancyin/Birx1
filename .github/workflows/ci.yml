name: Brix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify lockfile
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build frontend
        run: npm run build:frontend

      - name: Build backend
        run: npm run build:backend
