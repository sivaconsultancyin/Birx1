name: Brix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck --workspace @brix/frontend
      - run: npm run lint --workspace @brix/frontend
      - run: npm run test --workspace @brix/frontend
      - run: npm run build --workspace @brix/frontend

  backend:
    name: Backend typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck --workspace @brix/backend
      - run: npm run lint --workspace @brix/backend
      - run: npm run test --workspace @brix/backend
      - run: npm run build --workspace @brix/backend
