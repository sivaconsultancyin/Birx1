name: E2E Browser Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.repository }}
  cancel-in-progress: true

jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local backend
        run: npm run build:backend && npm run start:backend > /tmp/brix-backend.log 2>&1 &
        env:
          PORT: '3000'
          NODE_ENV: test
          E2E_TEST_MODE: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Start local frontend
        run: npm run build:frontend && npx vite --host 127.0.0.1 --port 5173 > /tmp/brix-frontend.log 2>&1 &
        env:
          VITE_BACKEND_URL: http://127.0.0.1:3000
          VITE_API_URL: http://127.0.0.1:3000
      - name: Wait for local app
        run: |
          set +e
          node -e "const http=require('http'); const urls=['http://127.0.0.1:3000/api/ready','http://127.0.0.1:5173']; let left=new Set(urls); const t=Date.now(); const check=()=>{for(const u of [...left]) http.get(u,r=>{if(r.statusCode<500) left.delete(u); r.resume();}).on('error',()=>{}); if(!left.size) process.exit(0); if(Date.now()-t>120000) process.exit(1); setTimeout(check,1000)}; check();"
          status=$?
          echo "=== BACKEND LOG ==="
          cat /tmp/brix-backend.log || true
          echo "=== FRONTEND LOG ==="
          cat /tmp/brix-frontend.log || true
          exit $status
      - name: Run E2E tests
        id: e2e
        continue-on-error: true
        run: npm run test:e2e -- --workers=1
        env:
          E2E_SMOKE_ONLY: '0'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_MOBILE: ${{ secrets.E2E_TEST_MOBILE }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          BASE_URL: http://127.0.0.1:5173
          BACKEND_URL: http://127.0.0.1:3000
          FRONTEND_URL: http://127.0.0.1:5173
          VITE_BACKEND_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/brix-backend.log
            /tmp/brix-frontend.log

      - name: Fail job when E2E tests fail
        if: steps.e2e.outcome != 'success'
        run: exit 1
