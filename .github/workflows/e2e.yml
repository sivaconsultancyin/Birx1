name: Brix E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brix-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build backend
        run: npm run build --workspace @brix/backend
      - name: Start backend
        run: npm run start --workspace @brix/backend > /tmp/brix-backend.log 2>&1 &
        env:
          PORT: '3000'
          NODE_ENV: test
          E2E_TEST_MODE: '1'
          E2E_SMOKE_ONLY: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Build frontend
        run: npm run build --workspace @brix/frontend
        env:
          VITE_API_URL: http://127.0.0.1:3000
          VITE_SOCKET_URL: http://127.0.0.1:3000
          VITE_APP_ENV: test
      - name: Start frontend
        run: npm run preview --workspace @brix/frontend -- --host 127.0.0.1 --port 4173 > /tmp/brix-frontend.log 2>&1 &
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            backend=$(curl -s -o /tmp/backend-health.json -w "%{http_code}" http://127.0.0.1:3000/api/health || true)
            frontend=$(curl -s -o /tmp/frontend-health.html -w "%{http_code}" http://127.0.0.1:4173 || true)
            if [ "$backend" = "200" ] && [ "$frontend" = "200" ]; then exit 0; fi
            sleep 2
          done
          cat /tmp/brix-backend.log || true
          cat /tmp/brix-frontend.log || true
          exit 1

      - name: Run E2E
        run: npm run e2e --workspace @brix/frontend -- tests/foundation --workers=1 --timeout=15000
        env:
          BASE_URL: http://127.0.0.1:4173
          BACKEND_URL: http://127.0.0.1:3000
          FRONTEND_URL: http://127.0.0.1:4173
          VITE_API_URL: http://127.0.0.1:3000
          VITE_SOCKET_URL: http://127.0.0.1:3000
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_MOBILE: ${{ secrets.E2E_TEST_MOBILE }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brix-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/brix-backend.log
            /tmp/brix-frontend.log
