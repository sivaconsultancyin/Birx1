name: Sync npm lockfile
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only
      - name: Remove temporary workflow
        run: rm -f .github/workflows/sync-lockfile.yml
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/sync-lockfile.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync npm lockfile after dependency cleanup"
          git push origin HEAD:main
