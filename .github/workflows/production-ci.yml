name: Production CI

on:
  push:
    branches: [main, production-hardening-2026-09-22]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
