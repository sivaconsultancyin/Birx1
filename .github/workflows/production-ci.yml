name: Production CI

on:
  push:
    branches: ["main", "production-hardening-**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
