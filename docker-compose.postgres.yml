services:
  postgres:
    image: postgres:17-alpine
    container_name: birx1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-birx1}
      POSTGRES_USER: ${POSTGRES_USER:-birx1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - birx1_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-birx1} -d ${POSTGRES_DB:-birx1}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  birx1_postgres_data:
